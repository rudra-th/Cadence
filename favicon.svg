<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TimStudy">
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ts-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8E8E8E"/>
    </linearGradient>
    <radialGradient id="ts-glow" cx="0.28" cy="0.18" r="0.78">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#ts-bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#ts-glow)"/>

  <circle cx="256" cy="256" r="156" fill="none"
          stroke="url(#ts-ring)" stroke-width="37" stroke-linecap="round"
          stroke-dasharray="708 272" transform="rotate(145 256 256)"/>

  <line x1="256" y1="256" x2="304" y2="165" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <circle cx="304" cy="165" r="8" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
</svg>
